name: Desktop smoke checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Install application and tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows]" pytest
      - name: Compile source
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m pytest -q
