[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxlock-desktop"
version = "0.1.0"
description = "Local target-speaker isolation desktop app for Linux and Windows"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "numpy>=1.24",
    "soxr>=0.3",
    "soundfile>=0.12",
    "voxlock>=1.3.1,<2",
]

[project.optional-dependencies]
windows = ["sounddevice>=0.4.7"]

[project.scripts]
voxlock-desktop = "voxlock_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
